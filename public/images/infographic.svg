  <rect x="620" y="340" width="500" height="380" rx="12" fill="#c44d6e"/>
  <text x="870" y="420" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">Investering</text>
  <text x="870" y="520" text-anchor="middle" font-family="sans-serif" font-size="72" fill="white" font-weight="bold">€4.2M</text>
  <text x="870" y="570" text-anchor="middle" font-family="sans-serif" font-size="18" fill="rgba(255,255,255,0.9)">totale projectkosten</text>
